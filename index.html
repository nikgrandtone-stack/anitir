<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аниме Тир-Лист</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;900&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1a1030; --bg2:#2b1a4d; --pink:#ff6ec7; --cyan:#6ecbff; --gold:#ffd166;
  --card:#241542; --text:#f0e9ff;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans',sans-serif}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh;overflow-x:hidden}

/* фоновые частицы */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.particles span{position:absolute;bottom:-20px;color:var(--pink);opacity:.35;animation:rise linear infinite;font-size:18px}
@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}

header{text-align:center;padding:26px 10px 10px;position:relative;z-index:1}
h1{font-family:'Zen Maru Gothic',cursive;font-size:2.4rem;
   background:linear-gradient(90deg,var(--pink),var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
   filter:drop-shadow(0 0 12px rgba(255,110,199,.5));animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 6px rgba(255,110,199,.4))}to{filter:drop-shadow(0 0 18px rgba(110,203,255,.7))}}

.tabs{display:flex;justify-content:center;gap:12px;margin:18px 0;position:relative;z-index:1}
.tab-btn{padding:12px 30px;border:none;border-radius:30px 30px 0 0;cursor:pointer;font-size:1.05rem;font-weight:700;
  background:rgba(255,255,255,.07);color:var(--text);transition:.3s;border:2px solid transparent}
.tab-btn:hover{background:rgba(255,110,199,.2);transform:translateY(-3px)}
.tab-btn.active{background:linear-gradient(135deg,var(--pink),#b26bff);border-color:#fff3;box-shadow:0 4px 18px rgba(255,110,199,.45)}

.content{max-width:1100px;margin:0 auto;padding:10px 16px 60px;position:relative;z-index:1}
.page{display:none;animation:fadeIn .5s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

/* ===== ТИР-ЛИСТ ===== */
.tier-row{display:flex;border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--card);
  box-shadow:0 4px 14px rgba(0,0,0,.35);transition:.3s;border:2px solid transparent}
.tier-row:hover{border-color:var(--pink);transform:scale(1.005)}
.tier-label{flex:0 0 130px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;color:#fff;text-shadow:1px 2px 4px rgba(0,0,0,.4)}
.tier-zone{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:10px;min-height:90px}
.tier-item{position:relative;width:64px;height:92px;border-radius:8px;overflow:hidden;cursor:grab;transition:.25s;border:2px solid #fff2}
.tier-item:hover{transform:scale(1.15) rotate(-3deg);z-index:5;border-color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.tier-item img{width:100%;height:100%;object-fit:cover}
.tier-row.dragover{border-color:var(--gold);background:rgba(255,209,102,.08)}
.hint{padding:8px 14px;text-align:center;color:#bfa8e8;font-size:.92rem;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.55}}

/* ===== ТОП АНИМЕ ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.anime-tile{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:2/3;
  box-shadow:0 4px 14px rgba(0,0,0,.4);transition:.35s;border:2px solid transparent}
.anime-tile:hover{transform:translateY(-8px) scale(1.03);border-color:var(--pink);box-shadow:0 10px 28px rgba(255,110,199,.4)}
.anime-tile img{width:100%;height:100%;object-fit:cover;transition:.4s}
.anime-tile:hover img{transform:scale(1.08)}
.tile-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(15,8,35,.92));opacity:0;transition:.35s;
  display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.anime-tile:hover .tile-overlay{opacity:1}
.ru-title{font-weight:700;font-size:.92rem;line-height:1.25;color:#fff}
.badge{position:absolute;top:8px;left:8px;background:rgba(15,8,35,.85);border-radius:10px;padding:4px 9px;font-weight:900;font-size:.85rem;
  display:flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.badge .star{color:var(--gold)}
.s-high{color:#7ef29d}.s-mid{color:var(--gold)}.s-low{color:#ff8a8a}

/* пагинация */
.pager{display:flex;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap}
.pager button{padding:9px 16px;border:none;border-radius:20px;cursor:pointer;background:rgba(255,255,255,.08);color:var(--text);font-weight:700;transition:.25s}
.pager button:hover{background:rgba(110,203,255,.25);transform:translateY(-2px)}
.pager button.on{background:linear-gradient(135deg,var(--pink),#b26bff);box-shadow:0 3px 12px rgba(255,110,199,.5)}

.loading{text-align:center;padding:60px;font-size:1.1rem;color:var(--cyan)}
.loader{width:54px;height:54px;border:5px solid rgba(255,255,255,.15);border-top-color:var(--pink);border-radius:50%;
  margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{text-align:center;padding:30px;color:#ffb0b0;background:rgba(255,0,0,.08);border-radius:12px;max-width:600px;margin:20px auto}

/* модалка */
.modal{position:fixed;inset:0;background:rgba(10,5,25,.85);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-card{background:var(--card);border-radius:18px;max-width:420px;width:92%;padding:22px;text-align:center;animation:zoom .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes zoom{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card img{width:220px;border-radius:12px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.modal-card h3{margin-bottom:6px;color:var(--pink)}
.modal-card p{color:#cbb8ef;font-size:.9rem}
.add-btn{margin-top:14px;width:100%;padding:12px;border:none;border-radius:12px;font-weight:900;font-size:1rem;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),#b26bff);color:#fff;transition:.25s}
.add-btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
.close{position:absolute;top:10px;right:16px;font-size:1.6rem;cursor:pointer;color:#fff}
footer{text-align:center;padding:20px;color:#8f7ab8;font-size:.85rem;position:relative;z-index:1}
</style>
</head>
<body>
<div class="particles" id="particles"></div>

<header><h1>✨ Аниме Тир-Лист ✨</h1></header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="tier">🏆 Тир-лист</button>
  <button class="tab-btn" data-tab="top">📺 Топ аниме</button>
</nav>

<main class="content">
  <!-- ТИР-ЛИСТ -->
  <section class="page active" id="tier">
    <p class="hint">💡 Открой страницу «Топ аниме», нажми на плитку — и добавь аниме в тир-лист. Можно перетаскивать мышкой!</p>
    <div id="tiers"></div>
  </section>

  <!-- ТОП АНИМЕ -->
  <section class="page" id="top">
    <div id="topContent"><div class="loading"><div class="loader"></div>Загружаем топ с MyAnimeList…</div></div>
    <div class="pager" id="pager"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-card" style="position:relative">
    <span class="close" onclick="closeModal()">✕</span>
    <img id="mImg" src="" alt="">
    <h3 id="mTitle"></h3>
    <p id="mScore"></p>
    <button class="add-btn" id="mAdd">➕ Добавить в тир-лист</button>
  </div>
</div>

<footer>Данные: MyAnimeList (Jikan API) · Русские названия: Shikimori</footer>

<script>
/* ---------- фоновые лепестки ---------- */
const P = document.getElementById('particles');
for (let i=0;i<25;i++){
  const s=document.createElement('span');
  s.textContent=['🌸','⭐','✨','💗'][i%4];
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(8+Math.random()*14)+'s';
  s.style.animationDelay=-Math.random()*20+'s';
  s.style.fontSize=(12+Math.random()*16)+'px';
  P.appendChild(s);
}

/* ---------- вкладки ---------- */
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById(b.dataset.tab).classList.add('active');
  if(b.dataset.tab==='top' && !loaded) loadTop();
});

/* ---------- тир-лист ---------- */
const TIERS=[
 {name:'10',color:'#ff7ba8'},{name:'9',color:'#ff9d6c'},{name:'8',color:'#ffd166'},
 {name:'7',color:'#a8e063'},{name:'6',color:'#6ecbff'},{name:'1-5',color:'#b39ddb'},
 {name:'Хочу посмотреть',color:'#80cbc4'},{name:'Не смотрел',color:'#8d8d8d'}
];
const tiersEl=document.getElementById('tiers');
TIERS.forEach(t=>{
  const row=document.createElement('div');row.className='tier-row';
  row.innerHTML=`<div class="tier-label" style="background:${t.color}">${t.name}</div>
  <div class="tier-zone" data-tier="${t.name}"></div>`;
  const zone=row.querySelector('.tier-zone');
  zone.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('dragover')});
  zone.addEventListener('dragleave',()=>row.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{
    e.preventDefault();row.classList.remove('dragover');
    const id=e.dataTransfer.getData('id');
    const el=document.querySelector(`.tier-item[data-id="${id}"]`);
    if(el) zone.appendChild(el);
  });
  tiersEl.appendChild(row);
});
const tierCnt={};
function addTier(anime){
  const cnt=tierCnt[anime.mal_id]=(tierCnt[anime.mal_id]||0)+1;
  const it=document.createElement('div');
  it.className='tier-item';it.draggable=true;it.dataset.id=anime.mal_id+'_'+cnt;
  it.title=anime.ru_title||anime.title;
  it.innerHTML=`<img src="${anime.images?.jpg?.image_url}" alt="">`;
  it.addEventListener('dragstart',e=>e.dataTransfer.setData('id',it.dataset.id));
  // «Хочу посмотреть» по умолчанию
  document.querySelector('[data-tier="Хочу посмотреть"]').appendChild(it);
}

/* ---------- загрузка Top с MAL (Jikan) ---------- */
let loaded=false, allAnime=[], page=1, PER=25;
const selTier=document.createElement('select');
selTier.style.cssText='width:100%;margin-top:10px;padding:10px;border-radius:12px;border:none;font-weight:700;background:#1a1030;color:#fff';
TIERS.forEach(t=>selTier.add(new Option(t.name,t.name)));

async function ruName(malId, fallback){
  try{
    const r=await fetch(`https://corsproxy.io/?url=${encodeURIComponent('https://shikimori.io/api/animes/'+malId)}`);
    if(!r.ok) throw 0;
    const d=await r.json();
    return {name:d.russian||d.name||fallback};
  }catch(e){return {name:fallback}}
}

async function loadTop(){
  try{
    const res=[]; // 3 страницы API = 75 аниме
    for(let p=1;p<=3;p++){
      const r=await fetch(`https://api.jikan.moe/v4/top/anime?page=${p}&limit=25`);
      if(!r.ok) throw new Error('HTTP '+r.status);
      res.push(...(await r.json()).data);
    }
    allAnime=res.map(a=>({a, ru:{name:a.title}}));
    loaded=true; renderPage();
    // русские названия с shikimori — дoganruesome, доfill
    allAnime.forEach(async (it,i)=>{
      const r=await ruName(it.a.mal_id, it.a.title);
      it.ru=r; needTitleRefresh=true; refreshTitles();
    });
  }catch(e){
    document.getElementById('topContent').innerHTML=
      `<div class="error-box">Не удалось загрузить данные с MyAnimeList 😿<br>Проверь интернет и обнови страницу.</div>`;
  }
}
let needTitleRefresh=false;
function refreshTitles(){
  document.querySelectorAll('.ru-title').forEach((el,i)=>{
    if(allAnime[i+((page-1)*PER)]) el.textContent=allAnime[i+((page-1)*PER)].ru.name;
  });
}
function scoreClass(s){return s>=8?'s-high':s>=7?'s-mid':'s-low'}
function renderPage(){
  const c=document.getElementById('topContent');
  const slice=allAnime.slice((page-1)*PER,page*PER);
  c.innerHTML='<div class="grid">'+slice.map((it,i)=>{
    const a=it.a, idx=(page-1)*PER+i;
    return `<div class="anime-tile" onclick="openModal(${idx})">
      <div class="badge"><span class="star">★</span><span class="${scoreClass(a.score)}">${a.score??'—'}</span></div>
      <img src="${a.images?.jpg?.large_image_url||a.images?.jpg?.image_url}" alt="${a.title}" loading="lazy">
      <div class="tile-overlay"><div class="ru-title">${it.ru.name}</div></div>
    </div>`;
  }).join('')+'</div>';
  // пагинация
  const pages=Math.ceil(allAnime.length/PER);
  const pg=document.getElementById('pager');pg.innerHTML='';
  for(let i=1;i<=pages;i++){
    const b=document.createElement('button');b.textContent=i;
    if(i===page)b.classList.add('on');
    b.onclick=()=>{page=i;renderPage();window.scrollTo({top:0,behavior:'smooth'})};
    pg.appendChild(b);
  }
}

/* ---------- модалка ---------- */
let current=null;
function openModal(idx){
  const it=allAnime[idx];current=it;
  document.getElementById('mImg').src=it.a.images?.jpg?.large_image_url||'';
  document.getElementById('mTitle').textContent=it.ru.name;
  document.getElementById('mScore').innerHTML=
    `Оценка MAL: <b class="${scoreClass(it.a.score)}">★ ${it.a.score??'—'}</b><br>`+
    (it.a.year?`Год: ${it.a.year} · `:'')+`Эпизоды: ${it.a.episodes??'?'} · Жанр: ${(it.a.genres||[]).slice(0,3).map(g=>g.name).join(', ')}`;
  const box=document.getElementById('mAdd');
  box.replaceWith(selTier); selTier.id='mAdd'; selTier.className='add-btn';
  const add=document.createElement('button');add.className='add-btn';add.id='mAddBtn';
  add.textContent='➕ Добавить в тир-лист';
  add.onclick=()=>{addTier({...current.a, ru_title:current.ru.name});closeModal()};
  selTier.after(add);
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script>
</body>
</html>
